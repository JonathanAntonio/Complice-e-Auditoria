events {
    worker_connections 1024;
}

http {
    upstream identity {
        # Serviços rodando no host (pnpm run dev) ou host.docker.internal em Linux
        server host.docker.internal:4001;
    }

    upstream compliance {
        server host.docker.internal:4002;
    }

    upstream api_docs {
        server host.docker.internal:4010;
    }

    upstream integration {
        server host.docker.internal:4003;
    }

    upstream audit {
        server host.docker.internal:4005;
    }

    upstream risk {
        server host.docker.internal:4006;
    }

    upstream messaging {
        server host.docker.internal:4011;
    }

    upstream reporting {
        server host.docker.internal:4007;
    }

    upstream notification {
        server host.docker.internal:4008;
    }

    server {
        listen 80;
        server_name localhost;

        # Superfície pública mínima para autenticação (BFF/Auth Proxy):
        # Apenas /identity/api/v1/auth/* e legado /identity/api/auth/* ficam acessíveis externamente.
        location /identity/api/v1/auth/ {
            proxy_pass http://identity/api/v1/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Gateway "nginx" always;
        }

        location /identity/api/auth/ {
            proxy_pass http://identity/api/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Gateway "nginx" always;
        }

        # Health de identity pode ficar público para monitoramento.
        location = /identity/health {
            proxy_pass http://identity/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Gateway "nginx" always;
        }

        # Identity: /identity/*
        location /identity/ {
            # Todo restante de /identity/* fica restrito ao host local.
            allow 127.0.0.1;
            allow ::1;
            allow 172.16.0.0/12;
            deny all;

            proxy_pass http://identity/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Corrige redirects do swagger-ui-express (ex.: /identity/api-docs -> Location: /api-docs/)
            proxy_redirect /api-docs/ $scheme://$http_host/identity/api-docs/;
            proxy_redirect /api-docs $scheme://$http_host/identity/api-docs/;
            add_header X-Gateway "nginx" always;
        }

        # Compliance: /compliance/*
        location /compliance/ {
            # Serviço privado (somente acesso local).
            allow 127.0.0.1;
            allow ::1;
            # Tráfego do host para o container nginx via bridge Docker (ex.: 172.27.0.1).
            allow 172.16.0.0/12;
            deny all;

            proxy_pass http://compliance/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Corrige redirects do swagger-ui-express (ex.: /compliance/api-docs -> Location: /api-docs/)
            proxy_redirect /api-docs/ $scheme://$http_host/compliance/api-docs/;
            proxy_redirect /api-docs $scheme://$http_host/compliance/api-docs/;
            add_header X-Gateway "nginx" always;
        }

        # Swagger unificado: /api-docs/*
        location /api-docs/ {
            # Docs unificadas privadas (somente acesso local).
            allow 127.0.0.1;
            allow ::1;
            allow 172.16.0.0/12;
            deny all;

            proxy_pass http://api_docs/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Gateway "nginx" always;
        }

        # Integration: /integration/*
        location /integration/ {
            # Serviço privado (somente acesso local).
            allow 127.0.0.1;
            allow ::1;
            deny all;

            proxy_pass http://integration/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Corrige redirects do swagger-ui-express (ex.: /integration/api-docs -> Location: /api-docs/)
            proxy_redirect /api-docs/ $scheme://$http_host/integration/api-docs/;
            proxy_redirect /api-docs $scheme://$http_host/integration/api-docs/;
            add_header X-Gateway "nginx" always;
        }

        # Audit: /audit/*
        location /audit/ {
            # Serviço privado (somente acesso local).
            allow 127.0.0.1;
            allow ::1;
            allow 172.16.0.0/12;
            deny all;

            proxy_pass http://audit/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect /api-docs/ $scheme://$http_host/audit/api-docs/;
            proxy_redirect /api-docs $scheme://$http_host/audit/api-docs/;
            add_header X-Gateway "nginx" always;
        }

        # Risk Analysis: /risk/*
        location /risk/ {
            allow 127.0.0.1;
            allow ::1;
            allow 172.16.0.0/12;
            deny all;

            proxy_pass http://risk/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect /api-docs/ $scheme://$http_host/risk/api-docs/;
            proxy_redirect /api-docs $scheme://$http_host/risk/api-docs/;
            add_header X-Gateway "nginx" always;
        }

        # Reporting: /reporting/*
        location /reporting/ {
            allow 127.0.0.1;
            allow ::1;
            allow 172.16.0.0/12;
            deny all;

            proxy_pass http://reporting/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect /api-docs/ $scheme://$http_host/reporting/api-docs/;
            proxy_redirect /api-docs $scheme://$http_host/reporting/api-docs/;
            add_header X-Gateway "nginx" always;
        }

        # Messaging: /messaging/*
        location /messaging/ {
            allow 127.0.0.1;
            allow ::1;
            allow 172.16.0.0/12;
            deny all;

            proxy_pass http://messaging/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect /api-docs/ $scheme://$http_host/messaging/api-docs/;
            proxy_redirect /api-docs $scheme://$http_host/messaging/api-docs/;
            add_header X-Gateway "nginx" always;
        }

        # Notification: /notification/*
        location /notification/ {
            allow 127.0.0.1;
            allow ::1;
            allow 172.16.0.0/12;
            deny all;

            proxy_pass http://notification/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect /api-docs/ $scheme://$http_host/notification/api-docs/;
            proxy_redirect /api-docs $scheme://$http_host/notification/api-docs/;
            add_header X-Gateway "nginx" always;
        }

        # Health do gateway
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        location / {
            return 404 '{"error":"Not Found","message":"Use /identity/, /compliance/, /integration/, /audit/, /risk/, /reporting/, /notification/, /messaging/ ou /api-docs/"}';
            add_header Content-Type application/json;
        }
    }
}
