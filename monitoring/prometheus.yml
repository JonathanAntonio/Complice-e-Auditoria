global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: identity-service
    static_configs:
      - targets: ["host.docker.internal:3001"]

  - job_name: compliance-service
    static_configs:
      - targets: ["host.docker.internal:3002"]

  - job_name: integration-service
    static_configs:
      - targets: ["host.docker.internal:3003"]

  - job_name: audit-service
    static_configs:
      - targets: ["host.docker.internal:3005"]

  - job_name: risk-analysis-service
    static_configs:
      - targets: ["host.docker.internal:3006"]

  - job_name: reporting-service
    static_configs:
      - targets: ["host.docker.internal:3007"]

  - job_name: notification-service
    static_configs:
      - targets: ["host.docker.internal:3008"]

  - job_name: bff-service
    static_configs:
      - targets: ["host.docker.internal:8081"]
