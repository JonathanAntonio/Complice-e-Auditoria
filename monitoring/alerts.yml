groups:
  - name: lframework-slo
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service down ({{ $labels.job }})"
          description: "Prometheus could not scrape {{ $labels.job }} for more than 1 minute."

      - alert: Api5xxRatioHigh
        expr: |
          (
            sum by (service) (increase(http_requests_total{status_class="5xx"}[5m]))
            /
            clamp_min(sum by (service) (increase(http_requests_total[5m])), 1)
          ) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx ratio ({{ $labels.service }})"
          description: "5xx ratio above 1% for 5 minutes on {{ $labels.service }}."

      - alert: ApiLatencyP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 latency above 500ms ({{ $labels.service }})"
          description: "P95 latency is above 500ms for 5 minutes on {{ $labels.service }}."
